name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build:win -- --publish never
          - os: macos-latest
            build_cmd: npm run build:mac -- --publish never
          - os: ubuntu-latest
            build_cmd: npm run build:linux -- --publish never

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create config.json from secrets
        shell: bash
        run: |
          cat > config.json << 'ENDCONFIG'
          {
            "api_url": "PLACEHOLDER_API_URL",
            "api_secret": "PLACEHOLDER_API_SECRET",
            "admin_password_hash": "PLACEHOLDER_ADMIN_HASH"
          }
          ENDCONFIG
          node -e "
            const fs = require('fs');
            const config = {
              api_url: process.env.CFG_API_URL,
              api_secret: process.env.CFG_API_SECRET,
              admin_password_hash: process.env.CFG_ADMIN_HASH
            };
            fs.writeFileSync('config.json', JSON.stringify(config, null, 2));
          "
        env:
          CFG_API_URL: ${{ secrets.API_URL }}
          CFG_API_SECRET: ${{ secrets.API_SECRET }}
          CFG_ADMIN_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}

      - name: Build
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -30

      # The README tells people to verify their download against a published
      # checksum, so one has to actually be published. Computed here on the
      # runner from the very files that are about to be uploaded, which is the
      # only point at which the two are guaranteed to be the same bytes.
      - name: Generate checksums
        id: checksums
        run: |
          cd artifacts
          sha256sum *.exe *.dmg *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo 'body<<CHECKSUM_EOF'
            echo '## Verify your download'
            echo
            echo 'Compare the SHA256 of the file you downloaded against the value here.'
            echo 'If they match, the file is byte-for-byte what was built and published.'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo '| | |'
            echo '| - | - |'
            echo '| Windows | `certutil -hashfile <file> SHA256` |'
            echo '| macOS | `shasum -a 256 <file>` |'
            echo '| Linux | `sha256sum <file>` |'
            echo 'CHECKSUM_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        # Pinned to a commit, not a tag. A tag can be moved to point at
        # different code at any time, and this step runs with a token that can
        # write to the repository — so whoever controls the tag would control
        # what runs here. The SHA cannot be repointed.
        # softprops/action-gh-release v3.0.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/SHA256SUMS.txt
          body: ${{ steps.checksums.outputs.body }}
          generate_release_notes: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
