<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HackLayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #020205;
            overflow: hidden;
        }

        .bg-image {
            position: fixed;
            inset: 0;
            background: url('assets/river-bg.jpg') center center / cover no-repeat;
            z-index: 0;
        }

        /* Subtle forward-motion overlay */
        .motion-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- Static background image (the reference scene) -->
    <div class="bg-image"></div>

    <!-- Lightweight animation overlay -->
    <canvas id="fx-canvas"></canvas>

    <script>
        // Lightweight overlay effects on top of static image:
        // - Fire flicker glow (simulates torch light dancing)
        // - Water ripple shimmer
        // - Fog/mist drift
        // - Subtle forward motion particles

        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, time = 0;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Torch glow positions (approximate — left and right sides)
        const torchGlows = [
            { x: 0.15, y: 0.4 }, { x: 0.85, y: 0.4 },
            { x: 0.08, y: 0.35 }, { x: 0.92, y: 0.35 },
            { x: 0.22, y: 0.45 }, { x: 0.78, y: 0.45 },
            { x: 0.12, y: 0.5 }, { x: 0.88, y: 0.5 },
        ];

        // Fog particles
        const fogParticles = [];
        for (let i = 0; i < 20; i++) {
            fogParticles.push({
                x: Math.random(),
                y: 0.3 + Math.random() * 0.4,
                r: 80 + Math.random() * 150,
                dx: (Math.random() - 0.5) * 0.0002,
                opacity: 0.01 + Math.random() * 0.02,
                phase: Math.random() * Math.PI * 2,
            });
        }

        // Ember/spark particles (float up from torches)
        const embers = [];
        for (let i = 0; i < 15; i++) {
            embers.push(makeEmber());
        }
        function makeEmber() {
            const side = Math.random() < 0.5;
            return {
                x: side ? 0.1 + Math.random() * 0.15 : 0.75 + Math.random() * 0.15,
                y: 0.35 + Math.random() * 0.2,
                vy: -0.0005 - Math.random() * 0.001,
                vx: (Math.random() - 0.5) * 0.0003,
                life: 1,
                decay: 0.003 + Math.random() * 0.005,
                size: 1 + Math.random() * 2,
            };
        }

        // Water shimmer lines
        const shimmerLines = [];
        for (let i = 0; i < 12; i++) {
            shimmerLines.push({
                y: 0.6 + Math.random() * 0.35,
                x: Math.random(),
                len: 0.05 + Math.random() * 0.15,
                speed: 0.5 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2,
                opacity: 0.02 + Math.random() * 0.04,
            });
        }

        function draw() {
            time += 0.016;
            ctx.clearRect(0, 0, w, h);

            // 1. Torch fire glow (flickering radial glow on sides)
            torchGlows.forEach((t, i) => {
                const flicker = Math.sin(time * 4 + i * 2.3) * 0.3 + Math.sin(time * 7 + i) * 0.15;
                const baseAlpha = 0.04 + flicker * 0.02;
                const radius = (60 + flicker * 20) * (w / 1000);

                const grad = ctx.createRadialGradient(
                    t.x * w, t.y * h, 0,
                    t.x * w, t.y * h, radius
                );
                grad.addColorStop(0, `rgba(255, 140, 40, ${baseAlpha})`);
                grad.addColorStop(0.5, `rgba(200, 80, 15, ${baseAlpha * 0.4})`);
                grad.addColorStop(1, `rgba(100, 40, 5, 0)`);

                ctx.fillStyle = grad;
                ctx.fillRect(t.x * w - radius, t.y * h - radius, radius * 2, radius * 2);
            });

            // 2. Water shimmer (horizontal glint lines)
            shimmerLines.forEach(s => {
                const shimmer = Math.sin(time * s.speed + s.phase);
                if (shimmer < 0.3) return; // only show at peaks

                const alpha = s.opacity * shimmer;
                const sx = s.x * w;
                const sy = s.y * h;
                const len = s.len * w;

                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + len, sy + Math.sin(time + s.phase) * 2);
                ctx.strokeStyle = `rgba(150, 180, 200, ${alpha})`;
                ctx.lineWidth = 0.5 + shimmer * 0.5;
                ctx.stroke();
            });

            // 3. Fog drift
            fogParticles.forEach(f => {
                f.x += f.dx;
                const breathe = Math.sin(time * 0.5 + f.phase) * 0.005;
                f.y += breathe * 0.01;

                if (f.x < -0.2) f.x = 1.2;
                if (f.x > 1.2) f.x = -0.2;

                const alpha = f.opacity * (0.7 + Math.sin(time * 0.3 + f.phase) * 0.3);
                const grad = ctx.createRadialGradient(
                    f.x * w, f.y * h, 0,
                    f.x * w, f.y * h, f.r
                );
                grad.addColorStop(0, `rgba(180, 190, 200, ${alpha})`);
                grad.addColorStop(1, `rgba(100, 110, 120, 0)`);
                ctx.fillStyle = grad;
                ctx.fillRect(f.x * w - f.r, f.y * h - f.r, f.r * 2, f.r * 2);
            });

            // 4. Embers / sparks floating up
            embers.forEach((e, i) => {
                e.x += e.vx;
                e.y += e.vy;
                e.life -= e.decay;

                if (e.life <= 0) {
                    embers[i] = makeEmber();
                    return;
                }

                const alpha = e.life * 0.8;
                ctx.beginPath();
                ctx.arc(e.x * w, e.y * h, e.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, ${120 + Math.random() * 60}, 20, ${alpha})`;
                ctx.fill();
            });

            // 5. Subtle vignette (darken edges)
            const vignette = ctx.createRadialGradient(
                w * 0.5, h * 0.5, w * 0.2,
                w * 0.5, h * 0.5, w * 0.7
            );
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, w, h);

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>

</html>
