<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
    <title>HackLayer CTF - Profile</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            overflow-y: auto;
            background: #050505;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 24px 60px;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .top-bar .back {
            font-size: 12px;
            color: #9ca3af;
            cursor: pointer;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 7px;
            background: transparent;
            font-weight: 600;
            transition: all .2s;
        }

        .top-bar .back:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .top-bar .ver {
            font-size: 10px;
            color: #555;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        /* ===== HERO CARD ===== */
        .hero-card {
            position: relative;
            display: grid;
            grid-template-columns: 80px minmax(0, 1fr) auto;
            align-items: center;
            gap: 20px;
            padding: 28px 24px;
            border-radius: 14px;
            border: 1px solid rgba(0, 255, 136, .12);
            background:
                radial-gradient(circle at 15% 30%, rgba(0, 255, 136, .06), transparent 50%),
                rgba(10, 10, 10, .9);
            margin-bottom: 20px;
        }

        .hero-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #00b862);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: #000;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .hero-avatar::before {
            content: "";
            position: absolute;
            inset: -5px;
            border: 2px solid rgba(0, 255, 136, .5);
            border-radius: 50%;
        }

        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            position: relative;
            z-index: 1;
        }

        .hero-info h1 {
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            line-height: 1.2;
        }

        .hero-info .meta {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #9ca3af;
            font-weight: 600;
        }

        .hero-info .meta span {
            white-space: nowrap;
        }

        .hero-rank {
            text-align: center;
            padding: 10px 16px;
            border-radius: 10px;
            background: rgba(0, 255, 136, .06);
            border: 1px solid rgba(0, 255, 136, .12);
        }

        .hero-rank .num {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            line-height: 1;
        }

        .hero-rank .lbl {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            margin-top: 4px;
            font-weight: 700;
        }

        /* ===== STATS GRID ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            padding: 16px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .05);
            background: rgba(255, 255, 255, .025);
            text-align: center;
        }

        .stat-card .val {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            line-height: 1.1;
        }

        .stat-card .val.accent {
            color: var(--accent);
        }

        .stat-card .val.amber {
            color: #f59e0b;
        }

        .stat-card .lbl {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #666;
            margin-top: 6px;
            font-weight: 700;
        }

        /* ===== UPDATE TOAST ===== */
        .update-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15, 15, 15, .95);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
            transition: transform .3s ease;
            z-index: 100;
        }

        .update-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .update-toast button {
            padding: 5px 12px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            font-size: 10px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .4
            }

            50% {
                opacity: 1
            }
        }

        .loading .val,
        .loading .list-info strong {
            animation: pulse 1.2s infinite;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="top-bar">
            <button class="back" onclick="window.ctfAPI.navigate('category.html')">Back to Events</button>
            <span class="ver" id="ver"></span>
        </div>

        <!-- Hero Card -->
        <div class="hero-card">
            <div class="hero-avatar">
                <span id="avatarInitial">?</span>
                <img id="avatarImg" style="display:none" alt="">
            </div>
            <div class="hero-info">
                <h1 id="name">—</h1>
                <div class="meta">
                    <span id="email"></span>
                    <span id="joined"></span>
                </div>
            </div>
            <div class="hero-rank">
                <div class="num" id="rank">#-</div>
                <div class="lbl">Rank</div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="val accent" id="score">0</div>
                <div class="lbl">Score</div>
            </div>
            <div class="stat-card">
                <div class="val" id="flags">0</div>
                <div class="lbl">Flags</div>
            </div>
            <div class="stat-card">
                <div class="val" id="games">0</div>
                <div class="lbl">Games</div>
            </div>
            <div class="stat-card">
                <div class="val amber" id="wins">0</div>
                <div class="lbl">Wins</div>
            </div>
            <div class="stat-card">
                <div class="val" id="streak">0</div>
                <div class="lbl">Best Streak</div>
            </div>
            <div class="stat-card">
                <div class="val" id="rate">0%</div>
                <div class="lbl">Win Rate</div>
            </div>
        </div>
    </div>

    <div class="offline-bar" id="offlineBar">No Internet Connection</div>

    <div class="update-toast" id="updateToast">
        <span>v<span id="updateVer"></span> available</span>
        <button onclick="window.ctfAPI.installUpdate()">Update</button>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('offline', () => document.getElementById('offlineBar').classList.add('show'));
        window.addEventListener('online', () => document.getElementById('offlineBar').classList.remove('show'));
        if (!navigator.onLine) document.getElementById('offlineBar').classList.add('show');

        const token = sessionStorage.getItem('ctf_token');
        const user = JSON.parse(sessionStorage.getItem('ctf_user') || '{}');
        let refreshTimer;

        window.ctfAPI.onUpdateDownloaded((version) => {
            document.getElementById('updateVer').textContent = version;
            document.getElementById('updateToast').classList.add('show');
        });

        function setIfChanged(id, value) {
            const el = document.getElementById(id);
            if (el && el.textContent !== String(value)) el.textContent = value;
        }


        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        async function load() {
            if (!token) { window.ctfAPI.navigate('login.html'); return; }

            const name = user.display_name || user.username || '?';
            setIfChanged('name', name);
            setIfChanged('email', user.email || '');
            setIfChanged('avatarInitial', name[0].toUpperCase());

            if (user.avatar && user.avatar.startsWith('https://')) {
                const img = document.getElementById('avatarImg');
                img.onload = () => {
                    document.getElementById('avatarInitial').style.display = 'none';
                    img.style.display = 'block';
                };
                img.onerror = () => { img.style.display = 'none'; };
                img.src = user.avatar;
            }

            // Fetch stats
            try {
                const p = await window.ctfAPI.request('/profile', 'GET', null, token);
                if (p.status === 200 && p.data) {
                    const d = p.data;
                    setIfChanged('score', d.total_score || 0);
                    setIfChanged('flags', d.total_flags || 0);
                    setIfChanged('games', d.total_games || 0);
                    setIfChanged('wins', d.total_wins || 0);
                    setIfChanged('streak', d.best_streak || 0);
                    setIfChanged('rank', d.rank ? '#' + d.rank : '#-');
                    const rate = d.total_games > 0 ? Math.round((d.total_wins / d.total_games) * 100) : 0;
                    setIfChanged('rate', rate + '%');
                    if (d.joined) setIfChanged('joined', 'Joined ' + d.joined);
                }
            } catch (e) { }

            try {
                const cfg = await window.ctfAPI.getConfig();
                document.getElementById('ver').textContent = 'v' + (cfg.version || '1.0.0');
            } catch (e) { }
        }

        load();
        refreshTimer = setInterval(load, 60000);
    </script>
</body>

</html>
